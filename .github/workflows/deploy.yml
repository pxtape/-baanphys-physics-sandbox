name: Check and deploy Pages

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            poc/engine-comparison/package-lock.json
      - name: Install application dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and architecture boundaries
        run: npm run lint
      - name: Application tests
        run: npm test
      - name: Set up Python for existing schema checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install schema-check dependency
        run: python -m pip install 'jsonschema==4.26.0'
      - name: Existing M0 schema tests
        run: npm run test:m0
      - name: Install isolated PoC dependencies
        run: npm --prefix poc/engine-comparison ci --ignore-scripts
      - name: Existing physics evidence and replay verification
        run: npm run test:poc
      - name: Production build
        run: npm run build
      - name: Verify project path, built assets and refresh
        run: npm run test:pages
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy preview
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
